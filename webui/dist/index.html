<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>subrefine 控制台</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090b10;
      --card-bg: rgba(18, 22, 34, 0.7);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent: #6366f1;
      --accent-glow: rgba(99, 102, 241, 0.25);
      --accent-hover: #4f46e5;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --danger: #ef4444;
      --success: #10b981;
      --warning: #f59e0b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: radial-gradient(circle at 50% 0%, #1e1b4b 0%, var(--bg) 60%);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 32px 16px;
    }
    .container { width: 100%; max-width: 1080px; }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 32px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--card-border);
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .logo-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      box-shadow: 0 0 20px var(--accent-glow);
    }
    h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.5px; }
    .badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 6px;
      background: rgba(99, 102, 241, 0.15);
      color: #818cf8;
      border: 1px solid rgba(99, 102, 241, 0.3);
    }
    .card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }
    .input-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 14px;
      margin-bottom: 14px;
    }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    label { font-size: 13px; font-weight: 500; color: var(--text-muted); }
    input, textarea, select {
      background: rgba(10, 13, 22, 0.8);
      border: 1px solid var(--card-border);
      color: var(--text);
      padding: 11px 14px;
      border-radius: 10px;
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: all 0.2s ease;
    }
    input:focus, textarea:focus, select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }
    textarea { font-family: 'JetBrains Mono', monospace; font-size: 13px; resize: vertical; }
    .pipeline-builder {
      background: rgba(0, 0, 0, 0.2);
      border: 1px dashed var(--card-border);
      border-radius: 12px;
      padding: 16px;
      margin: 16px 0;
    }
    .pipeline-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .step-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
    .step-item {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--card-border);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 13px;
    }
    button {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 10px 18px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    button:hover { background: var(--accent-hover); box-shadow: 0 0 16px var(--accent-glow); }
    button.secondary {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-muted);
      border: 1px solid var(--card-border);
    }
    button.secondary:hover { background: rgba(255, 255, 255, 0.1); color: var(--text); box-shadow: none; }
    button.danger {
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }
    button.danger:hover { background: var(--danger); color: #fff; box-shadow: 0 0 16px rgba(239, 68, 68, 0.3); }
    .sub-card {
      background: rgba(13, 16, 27, 0.6);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 14px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      transition: border-color 0.2s ease;
    }
    .sub-card:hover { border-color: rgba(99, 102, 241, 0.4); }
    .sub-card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }
    .sub-name { font-size: 16px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
    .sub-meta { font-size: 12px; color: var(--text-dim); margin-top: 4px; }
    .export-pills { display: flex; flex-wrap: wrap; gap: 8px; }
    .pill {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: #93c5fd;
      text-decoration: none;
      background: rgba(59, 130, 246, 0.1);
      border: 1px solid rgba(59, 130, 246, 0.2);
      padding: 4px 10px;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .pill:hover { background: rgba(59, 130, 246, 0.2); border-color: #60a5fa; }
    .pill.copy-btn { color: #a5b4fc; background: rgba(99, 102, 241, 0.1); border-color: rgba(99, 102, 241, 0.2); }
    .pill.copy-btn:hover { background: rgba(99, 102, 241, 0.2); border-color: #818cf8; }
    .node-preview-modal {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 200;
      padding: 20px;
    }
    .modal-content {
      background: var(--bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      width: 100%;
      max-width: 760px;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
    }
    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-body {
      padding: 20px;
      overflow-y: auto;
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
    }
    .node-tag-item {
      padding: 8px 12px;
      background: rgba(255, 255, 255, 0.03);
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .node-proto {
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(255,255,255,0.08);
      color: #94a3b8;
    }
    #authOverlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(9, 11, 16, 0.96);
      backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .auth-box {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 36px;
      border-radius: 20px;
      width: 100%;
      max-width: 400px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    }
    .hidden { display: none !important; }
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      padding: 12px 20px;
      border-radius: 10px;
      background: #1e1b4b;
      border: 1px solid var(--accent);
      color: #fff;
      font-size: 13px;
      font-weight: 500;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      z-index: 999;
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.2s ease;
      pointer-events: none;
    }
    .toast.show { opacity: 1; transform: translateY(0); }
  </style>
</head>
<body>
  <!-- Toast Notification -->
  <div id="toast" class="toast">已复制到剪贴板</div>

  <!-- Auth Dialog -->
  <div id="authOverlay">
    <div class="auth-box">
      <div class="logo-icon" style="margin: 0 auto 16px; width: 44px; height: 44px; font-size: 22px;">⚡</div>
      <h2 style="margin-bottom: 8px; font-size: 20px; font-weight: 700;">subrefine</h2>
      <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 24px;">输入 Admin Token 解锁管理后台</p>
      <input type="password" id="adminTokenInput" placeholder="Admin Bearer Token..." onkeydown="if(event.key==='Enter')authenticate()" />
      <button style="width: 100%; margin-top: 14px; justify-content: center;" onclick="authenticate()">进入控制台</button>
      <div id="authError" style="color: var(--danger); font-size: 12px; margin-top: 12px;" class="hidden">认证失败：Token 不匹配</div>
    </div>
  </div>

  <!-- Node Preview Modal -->
  <div id="nodeModal" class="node-preview-modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modalTitle" style="font-size: 16px;">节点实时预览</h3>
        <button class="secondary" style="padding: 4px 10px;" onclick="closeModal()">关闭</button>
      </div>
      <div class="modal-body" id="modalNodesList">
        <!-- Node Items -->
      </div>
    </div>
  </div>

  <div class="container">
    <header>
      <div class="logo">
        <div class="logo-icon">⚡</div>
        <div>
          <h1>subrefine</h1>
          <div style="font-size: 12px; color: var(--text-dim);">极轻量 Go 订阅聚合与节点管线处理器</div>
        </div>
      </div>
      <div style="display: flex; align-items: center; gap: 12px;">
        <span class="badge">&lt; 15MB RSS</span>
        <button class="secondary" onclick="logout()" style="padding: 6px 12px; font-size: 12px;">注销</button>
      </div>
    </header>

    <!-- Create / Edit Subscription -->
    <div class="card">
      <h2 style="font-size: 16px; margin-bottom: 16px; display: flex; align-items: center; gap: 8px;">
        <span>编排订阅</span>
      </h2>
      <div class="input-grid">
        <div class="form-group">
          <label>订阅标识 (ID)</label>
          <input type="text" id="subId" placeholder="例如: all-in-one" />
        </div>
        <div class="form-group">
          <label>订阅别名 (Name)</label>
          <input type="text" id="subName" placeholder="例如: 综合自选集群" />
        </div>
        <div class="form-group">
          <label>订阅私钥 (Sub Token)</label>
          <input type="text" id="subToken" placeholder="例如: my_secret_999" />
        </div>
      </div>

      <div class="form-group" style="margin-bottom: 14px;">
        <label>订阅源列表 (每行一个 HTTP/HTTPS 订阅地址或节点 URI)</label>
        <textarea id="subSources" rows="3" placeholder="https://airport.com/api/v1/client/subscribe?token=xxx&#10;vless://uuid@domain:443?security=reality...#MySelfHost&#10;ss://base64..."></textarea>
      </div>

      <!-- Pipeline Operators -->
      <div class="pipeline-builder">
        <div class="pipeline-title">
          <span>处理管线规则链 (Pipeline Operators)</span>
          <button class="secondary" style="padding: 4px 10px; font-size: 12px;" onclick="addPipelineStep()">+ 添加算子</button>
        </div>
        <div id="stepList" class="step-list">
          <!-- Dynamic Steps -->
        </div>
      </div>

      <div style="display: flex; justify-content: flex-end; gap: 10px;">
        <button onclick="saveSubscription()">保存并生效订阅</button>
      </div>
    </div>

    <!-- Active Subscriptions -->
    <div class="card">
      <h2 style="font-size: 16px; margin-bottom: 16px;">已编排订阅 (<span id="subCount">0</span>)</h2>
      <div id="subList">
        <div style="color: var(--text-dim); font-size: 13px;">加载中...</div>
      </div>
    </div>
  </div>

  <script>
    let token = localStorage.getItem('subrefine_admin_token') || '';
    let currentPipeline = [{ type: 'deduplicate' }];

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.innerText = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2000);
    }

    function checkAuth() {
      if (!token) {
        document.getElementById('authOverlay').classList.remove('hidden');
        return;
      }
      fetch('/api/admin/info', {
        headers: { 'Authorization': 'Bearer ' + token }
      }).then(res => {
        if (res.ok) {
          document.getElementById('authOverlay').classList.add('hidden');
          renderPipelineSteps();
          loadSubscriptions();
        } else {
          document.getElementById('authOverlay').classList.remove('hidden');
        }
      }).catch(() => {
        document.getElementById('authOverlay').classList.remove('hidden');
      });
    }

    function authenticate() {
      const val = document.getElementById('adminTokenInput').value.trim();
      if (!val) return;
      fetch('/api/admin/info', {
        headers: { 'Authorization': 'Bearer ' + val }
      }).then(res => {
        if (res.ok) {
          token = val;
          localStorage.setItem('subrefine_admin_token', token);
          document.getElementById('authOverlay').classList.add('hidden');
          document.getElementById('authError').classList.add('hidden');
          renderPipelineSteps();
          loadSubscriptions();
        } else {
          document.getElementById('authError').classList.remove('hidden');
        }
      }).catch(() => {
        document.getElementById('authError').classList.remove('hidden');
      });
    }

    function logout() {
      localStorage.removeItem('subrefine_admin_token');
      token = '';
      location.reload();
    }

    function renderPipelineSteps() {
      const list = document.getElementById('stepList');
      if (currentPipeline.length === 0) {
        list.innerHTML = '<div style="color: var(--text-dim); font-size: 12px;">暂无算子，直接按原始源输出</div>';
        return;
      }
      list.innerHTML = currentPipeline.map((step, idx) => {
        if (step.type === 'rename') {
          return `<div class="step-item">
            <span class="badge">正则重命名</span>
            <span>匹配: <code>${escapeHtml(step.pattern)}</code> &rarr; 替换: <code>${escapeHtml(step.repl)}</code></span>
            <button class="secondary" style="margin-left: auto; padding: 2px 8px; font-size: 11px;" onclick="removeStep(${idx})">移除</button>
          </div>`;
        } else if (step.type === 'filter') {
          return `<div class="step-item">
            <span class="badge">节点过滤</span>
            <span>包含: <code>${escapeHtml(step.include || '*')}</code> | 排除: <code>${escapeHtml(step.exclude || 'none')}</code></span>
            <button class="secondary" style="margin-left: auto; padding: 2px 8px; font-size: 11px;" onclick="removeStep(${idx})">移除</button>
          </div>`;
        } else if (step.type === 'deduplicate') {
          return `<div class="step-item">
            <span class="badge">特征去重</span>
            <span>协议 + 地址 + 端口 + 认证参数去重</span>
            <button class="secondary" style="margin-left: auto; padding: 2px 8px; font-size: 11px;" onclick="removeStep(${idx})">移除</button>
          </div>`;
        } else if (step.type === 'decorate') {
          return `<div class="step-item">
            <span class="badge">属性修饰</span>
            <span>注入指纹: <code>${escapeHtml(step.fingerprint || 'none')}</code> | 注入出站 Detour: <code>${escapeHtml(step.detour || 'none')}</code></span>
            <button class="secondary" style="margin-left: auto; padding: 2px 8px; font-size: 11px;" onclick="removeStep(${idx})">移除</button>
          </div>`;
        }
      }).join('');
    }

    function addPipelineStep() {
      const type = prompt("请选择算子类型 (1: 特征去重, 2: 正则重命名, 3: 节点过滤, 4: 属性修饰):", "1");
      if (type === "1") {
        currentPipeline.push({ type: 'deduplicate' });
      } else if (type === "2") {
        const pattern = prompt("输入匹配正则 (例如: HK-(\\d+)):");
        const repl = prompt("输入替换格式 (例如: 🇭🇰 香港 $1):");
        if (pattern) currentPipeline.push({ type: 'rename', pattern, repl: repl || '' });
      } else if (type === "3") {
        const include = prompt("输入保留正则/关键字 (留空忽略):") || '';
        const exclude = prompt("输入排除正则/关键字 (留空忽略):") || '';
        if (include || exclude) currentPipeline.push({ type: 'filter', include, exclude });
      } else if (type === "4") {
        const fp = prompt("统一注入 uTLS 指纹 (如 chrome, safari, 留空忽略):") || '';
        const detour = prompt("统一注入 Detour 出站 (如 WARP, 留空忽略):") || '';
        if (fp || detour) currentPipeline.push({ type: 'decorate', fingerprint: fp, detour });
      }
      renderPipelineSteps();
    }

    function removeStep(idx) {
      currentPipeline.splice(idx, 1);
      renderPipelineSteps();
    }

    function loadSubscriptions() {
      fetch('/api/admin/subscriptions', {
        headers: { 'Authorization': 'Bearer ' + token }
      }).then(res => res.json()).then(data => {
        const list = Array.isArray(data) ? data : [];
        document.getElementById('subCount').innerText = list.length;
        const container = document.getElementById('subList');
        if (list.length === 0) {
          container.innerHTML = '<div style="color: var(--text-dim); font-size: 13px;">暂无托管订阅</div>';
          return;
        }

        const origin = window.location.origin;
        container.innerHTML = list.map(sub => {
          const singboxUrl = `${origin}/s/${sub.id}?token=${encodeURIComponent(sub.token)}&target=sing-box`;
          const clashUrl = `${origin}/s/${sub.id}?token=${encodeURIComponent(sub.token)}&target=clash`;
          const uriUrl = `${origin}/s/${sub.id}?token=${encodeURIComponent(sub.token)}&target=uri`;

          return `
            <div class="sub-card">
              <div class="sub-card-header">
                <div>
                  <div class="sub-name">${escapeHtml(sub.name || sub.id)} <span class="badge">${escapeHtml(sub.id)}</span></div>
                  <div class="sub-meta">源数量: ${(sub.sources || []).length} | 管线算子: ${(sub.pipeline || []).length} | 密钥: <code>${escapeHtml(sub.token)}</code></div>
                </div>
                <div style="display: flex; gap: 8px;">
                  <button class="secondary" style="padding: 4px 10px; font-size: 12px;" onclick="previewNodes('${escapeHtml(sub.id)}')">节点预览</button>
                  <button class="danger" style="padding: 4px 10px; font-size: 12px;" onclick="deleteSub('${escapeHtml(sub.id)}')">删除</button>
                </div>
              </div>

              <div class="export-pills">
                <a class="pill" href="${singboxUrl}" target="_blank">sing-box 1.15 JSON</a>
                <span class="pill copy-btn" onclick="copyLink('${singboxUrl}')">📋 复制 sing-box</span>
                <a class="pill" href="${clashUrl}" target="_blank">Clash.Meta YAML</a>
                <span class="pill copy-btn" onclick="copyLink('${clashUrl}')">📋 复制 Clash</span>
                <a class="pill" href="${uriUrl}" target="_blank">Base64 订阅</a>
                <span class="pill copy-btn" onclick="copyLink('${uriUrl}')">📋 复制 Base64</span>
              </div>
            </div>
          `;
        }).join('');
      });
    }

    function copyLink(url) {
      navigator.clipboard.writeText(url).then(() => {
        showToast('已复制订阅链接');
      });
    }

    function previewNodes(id) {
      document.getElementById('nodeModal').classList.remove('hidden');
      document.getElementById('modalTitle').innerText = `节点实时预览 - [${id}]`;
      const body = document.getElementById('modalNodesList');
      body.innerHTML = '<div style="color: var(--text-dim);">实时抓取并执行 Pipeline 处理中...</div>';

      fetch(`/api/admin/subscriptions/${encodeURIComponent(id)}/nodes`, {
        headers: { 'Authorization': 'Bearer ' + token }
      }).then(res => res.json()).then(data => {
        if (!data.nodes || data.nodes.length === 0) {
          body.innerHTML = '<div style="color: var(--text-dim);">无有效可用节点或拉取失败</div>';
          return;
        }
        body.innerHTML = data.nodes.map(n => `
          <div class="node-tag-item">
            <div>
              <strong>${escapeHtml(n.tag)}</strong>
              <div style="font-size: 11px; color: var(--text-dim);">${escapeHtml(n.server)}:${n.port}</div>
            </div>
            <div style="display: flex; gap: 6px; align-items: center;">
              <span class="node-proto">${escapeHtml(n.type)}</span>
              ${n.security ? `<span class="badge" style="font-size: 10px;">${escapeHtml(n.security)}</span>` : ''}
              ${n.detour ? `<span class="badge" style="border-color: #ec4899; color: #f472b6; font-size: 10px;">detour:${escapeHtml(n.detour)}</span>` : ''}
            </div>
          </div>
        `).join('');
      }).catch(err => {
        body.innerHTML = `<div style="color: var(--danger);">加载失败: ${err.message}</div>`;
      });
    }

    function closeModal() {
      document.getElementById('nodeModal').classList.add('hidden');
    }

    function saveSubscription() {
      const id = document.getElementById('subId').value.trim();
      const name = document.getElementById('subName').value.trim();
      const subToken = document.getElementById('subToken').value.trim();
      const sources = document.getElementById('subSources').value.split('\n').map(s => s.trim()).filter(Boolean);

      if (!id || !subToken) {
        alert('订阅 ID 与 Sub Token 为必填项');
        return;
      }

      const body = {
        id,
        name: name || id,
        token: subToken,
        sources,
        enabled: true,
        pipeline: currentPipeline
      };

      fetch('/api/admin/subscriptions', {
        method: 'POST',
        headers: {
          'Authorization': 'Bearer ' + token,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(body)
      }).then(res => res.json()).then(res => {
        if (res.status === 'ok') {
          showToast('订阅保存成功');
          document.getElementById('subId').value = '';
          document.getElementById('subName').value = '';
          document.getElementById('subToken').value = '';
          document.getElementById('subSources').value = '';
          loadSubscriptions();
        } else {
          alert('保存失败: ' + (res.error || 'unknown'));
        }
      });
    }

    function deleteSub(id) {
      if (!confirm(`确认删除订阅 [${id}] 吗?`)) return;
      fetch('/api/admin/subscriptions/' + encodeURIComponent(id), {
        method: 'DELETE',
        headers: { 'Authorization': 'Bearer ' + token }
      }).then(() => {
        showToast('订阅已删除');
        loadSubscriptions();
      });
    }

    function escapeHtml(str) {
      return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    checkAuth();
  </script>
</body>
</html>
