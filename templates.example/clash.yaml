rules:
- AND,((NETWORK,udp),(DST-PORT,123)),DIRECT
- RULE-SET,Private,DIRECT
- GEOIP,LAN,DIRECT,no-resolve
- RULE-SET,Ads,REJECT
- DST-PORT,853,REJECT
- DST-PORT,3478,REJECT
- RULE-SET,AI,AI
- RULE-SET,MicrosoftCN,Bypass
- RULE-SET,AppleCN,Bypass
- RULE-SET,GameCN,Bypass
- RULE-SET,Google,Google
- RULE-SET,Netflix,Media
- RULE-SET,HBO,Media
- RULE-SET,PrimeVideo,Media
- RULE-SET,TikTok,TikTok
- RULE-SET,Spotify,Spotify
- RULE-SET,GeolocationNotCN,Available
- RULE-SET,GeositeCN,Bypass
- GEOIP,CN,Bypass,no-resolve
- MATCH,Final
