# mihomo full-config template. The @subrefine entry in `proxies` is the
# injection marker: delivered nodes are spliced in place, and the
# include-all/filter groups pick them up automatically. The listener keys
# (mixed-port / tun / tproxy-port) are kept or dropped per the delivery
# options, so this one file serves every combination. No device-specific
# secrets belong here — add your own WARP/egress as ordinary proxies if you
# have them, but a shared template must not carry anyone's private keys.
ipv6: true
mixed-port: 7890
tproxy-port: 9000
allow-lan: true
unified-delay: true
tcp-concurrent: true
find-process-mode: strict
keep-alive-idle: 600
keep-alive-interval: 15
disable-keep-alive: false
geo-auto-update: true
geodata-mode: false
geox-url:
  mmdb: https://geodata.kelee.one/Country-Masaiki.mmdb
  asn: https://geodata.kelee.one/GeoLite2-ASN-P3TERX.mmdb
profile:
  store-selected: true
  store-fake-ip: true
external-controller: :9090
external-ui: ui
external-ui-url: https://github.com/Zephyruso/zashboard/releases/latest/download/dist-pingfang-only.zip
dns:
  enable: true
  listen: :1053
  ipv6: true
  prefer-h3: true
  respect-rules: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.0/16
  fake-ip-range6: fdfe:dcba:9876::/64
  fake-ip-filter-mode: blacklist
  cache-size: 2048
  cache-algorithm: arc
  use-hosts: false
  use-system-hosts: false
  fake-ip-filter:
  - '*.lan'
  - '*.local'
  - '*.localdomain'
  - '*.internal'
  - '*.home.arpa'
  - localhost.ptlogin2.qq.com
  - +.msftconnecttest.com
  - +.msftncsi.com
  - time.windows.com
  - time.*.com
  - +.pool.ntp.org
  - +.ntp.org
  - stun.*
  - +.stunprotocol.org
  - +.weixin.qq.com
  - +.battlenet.com.cn
  default-nameserver:
  - 223.5.5.5
  - 119.29.29.29
  proxy-server-nameserver:
  - https://223.5.5.5/dns-query
  - https://doh.pub/dns-query
  nameserver:
  - https://223.5.5.5/dns-query
  - https://doh.pub/dns-query
  - https://120.53.53.53/dns-query
  - 223.5.5.5
  - 119.29.29.29
  nameserver-policy:
    rule-set:Private,GeositeCN:
    - https://223.5.5.5/dns-query
    - 223.5.5.5
    rule-set:GeolocationNotCN:
    - https://1.1.1.1/dns-query#Available
    - https://dns.google/dns-query#Available
    rule-set:AI:
    - https://1.1.1.1/dns-query#Available
    - https://dns.google/dns-query#Available
    rule-set:Google:
    - https://1.1.1.1/dns-query#Available
    - https://dns.google/dns-query#Available
tun:
  enable: true
  stack: mips
  auto-route: true
  strict-route: true
  auto-detect-interface: true
  dns-hijack:
  - any:53
  - tcp://any:53
  mtu: 1480
  udp-timeout: 300
  route-exclude-address:
  - 224.0.0.0/3
  - 239.255.255.250/32
  - 255.255.255.255/32
sniffer:
  enable: true
  sniff:
    HTTP:
      ports:
      - '80'
      - 8080-8880
      override-destination: true
    TLS:
      ports:
      - 443
      - 8443
      override-destination: true
    QUIC:
      ports:
      - 443
      - 8443
      override-destination: true
  force-domain:
  - +.v2ex.com
  - +.youtube.com
  - +.googlevideo.com
  - +.spotify.com
  - +.telegram.org
  - +.twitch.tv
  skip-domain:
  - Mijia Cloud
  - +.push.apple.com
  - +.icloud.com
  - +.local
  - +.lan
  - localhost
proxies:
- name: '@subrefine'
proxy-groups:
- name: Available
  type: select
  proxies:
  - Auto
  - Static
  - HK
  - TW
  - JP
  - KR
  - US
  - SG
  - EU
  - DIRECT
  icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Available.png
- name: Static
  type: select
  include-all: true
  icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Static.png
- name: AI
  type: select
  proxies:
  - US
  - SG
  - JP
  - HK
  - TW
  - KR
  - EU
  - Available
  icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/AI.png
- name: Google
  type: select
  proxies:
  - US
  - SG
  - JP
  - HK
  - TW
  - KR
  - EU
  - Available
  icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Google_Search.png
- name: Media
  type: select
  proxies:
  - Available
  - US
  - SG
  - JP
  - HK
  - TW
  - KR
  - EU
  icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Media.png
- name: TikTok
  type: select
  proxies:
  - Available
  - US
  - SG
  - JP
  - HK
  - TW
  - KR
  - EU
