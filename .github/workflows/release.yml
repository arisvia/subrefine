name: Release & Multi-Arch Packaging

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    name: Build Multi-Arch Binaries & GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: webui/package-lock.json

      - name: Install Console Dependencies
        working-directory: webui
        run: npm ci

      - name: Console Typecheck & Tests
        working-directory: webui
        run: |
          npm run typecheck
          npm run test

      - name: Build Console Bundle
        working-directory: webui
        run: npm run build

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache: true

      - name: Run Go Formatter, Vet & Tests
        run: |
          go vet ./...
          go test -race ./...

      - name: Build Multi-Arch Binaries
        run: |
          mkdir -p dist
          VERSION="${GITHUB_REF_NAME}"
          LDFLAGS="-s -w -X github.com/arisvia/subrefine/internal/api.Version=${VERSION}"

          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="${LDFLAGS}" -o dist/subrefine-linux-amd64 ./cmd/subrefine
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="${LDFLAGS}" -o dist/subrefine-linux-arm64 ./cmd/subrefine
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -ldflags="${LDFLAGS}" -o dist/subrefine-darwin-arm64 ./cmd/subrefine
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -ldflags="${LDFLAGS}" -o dist/subrefine-darwin-amd64 ./cmd/subrefine
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags="${LDFLAGS}" -o dist/subrefine-windows-amd64.exe ./cmd/subrefine
          CGO_ENABLED=0 GOOS=windows GOARCH=arm64 go build -ldflags="${LDFLAGS}" -o dist/subrefine-windows-arm64.exe ./cmd/subrefine

          EXPECTED=6
          ACTUAL=$(find dist -maxdepth 1 -type f | wc -l)
          if [ "${ACTUAL}" -ne "${EXPECTED}" ]; then
            echo "Error: expected ${EXPECTED} release assets, found ${ACTUAL}"
            ls -la dist
            exit 1
          fi

      - name: Generate Checksums
        run: |
          cd dist && sha256sum * > checksums.txt && cd ..

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          name: "subrefine ${{ github.ref_name }}"
          generate_release_notes: true
