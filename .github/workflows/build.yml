name: CI / PR Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Lint, Test & Smoke Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: webui/package-lock.json

      - name: Install Console Dependencies
        working-directory: webui
        run: npm ci

      - name: Console Typecheck
        working-directory: webui
        run: npm run typecheck

      - name: Console Tests
        working-directory: webui
        run: npm run test

      # The tracked webui/dist is what Node-less `go build` embeds, so every
      # asset the committed shell references must exist and carry the admin
      # API. Structural check — byte-for-byte rebuild determinism is not a
      # promise cross-platform toolchains can keep.
      - name: Committed Dist Integrity
        working-directory: webui
        run: |
          test -f dist/index.html || { echo "dist/index.html missing"; exit 1; }
          for A in $(grep -o '/assets/[^"]*' dist/index.html | sort -u); do
            test -f "dist$A" || { echo "committed shell references missing asset $A"; exit 1; }
          done
          ENTRY=$(sed -n 's|.*script type="module"[^>]*src="\(\/assets\/[^"]*\.js\)".*|\1|p' dist/index.html | head -1)
          [ -n "$ENTRY" ] || { echo "no entry bundle in shell"; exit 1; }
          grep -q '/api/admin/subscriptions' "dist$ENTRY" || { echo "entry bundle lacks admin API path"; exit 1; }
          grep -q 'node_modules' dist/index.html && { echo "shell references node_modules path"; exit 1; } || true

      - name: Build Console Bundle
        working-directory: webui
        run: npm run build

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache: true

      - name: Go Format & Vet
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Unformatted Go code found:"
            gofmt -d .
            exit 1
          fi
          go vet ./...

      - name: Go Test with Race Detector
        run: go test -race ./...

      - name: Smoke Build Binary
        # The binary fail-closes without an admin token; the smoke server needs one.
        env:
          SUBREFINE_ADMIN_TOKEN: ci-smoke-token
        run: |
          CGO_ENABLED=0 go build -ldflags="-s -w -X github.com/arisvia/subrefine/internal/api.Version=ci-smoke" -o subrefine ./cmd/subrefine/
          ./subrefine -v | grep -qx "subrefine ci-smoke" || { echo "version not stamped"; exit 1; }
          ./subrefine -host 127.0.0.1 -port 29999 &
          PID=$!
          sleep 2
          curl -fsS http://127.0.0.1:29999/healthz || (kill -9 $PID && exit 1)
          # The freshly built webui/dist must be embedded and served, with the
          # hashed chunks negotiable from their precompressed sidecars.
          SHELL_HTML=$(curl -fsS http://127.0.0.1:29999/)
          echo "$SHELL_HTML" | grep -q 'id="root"' || { echo "console shell not embedded"; kill -9 $PID; exit 1; }
          ASSET=$(echo "$SHELL_HTML" | sed -n 's|.*src="\(\/assets\/[^"]*\.js\)".*|\1|p' | head -1)
          [ -n "$ASSET" ] || { echo "shell references no bundle"; kill -9 $PID; exit 1; }
          curl -fsS -o /dev/null -H 'Accept-Encoding: br, gzip' "http://127.0.0.1:29999$ASSET" || { echo "$ASSET unavailable"; kill -9 $PID; exit 1; }
          kill -9 $PID
